<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 320px;
      font-family: Arial, sans-serif;
      background: #F4F6FA;
      color: #1A1A2E;
    }

    .header {
      background: #0050B3;
      color: white;
      padding: 16px 20px;
    }

    .header-title {
      font-size: 15px;
      font-weight: bold;
    }

    .header-sub {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .body {
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #E0E6F0;
    }

    .card-label {
      font-size: 11px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .contact-name {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .contact-detail {
      font-size: 12px;
      color: #555;
      margin-bottom: 3px;
    }

    .empty-state {
      text-align: center;
      padding: 20px 0;
      color: #888;
      font-size: 13px;
    }

    .empty-icon {
      font-size: 32px;
      margin-bottom: 8px;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .btn-primary {
      background: #0050B3;
      color: white;
    }

    .btn-primary:hover    { background: #003D8F; }
    .btn-primary:disabled { background: #999; cursor: not-allowed; }

    .btn-secondary {
      background: white;
      color: #0050B3;
      border: 1px solid #0050B3 !important;
    }

    .btn-secondary:hover { background: #EEF3FF; }

    .result-msg {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 10px;
      display: none;
    }

    .result-success {
      background: #E6F4EA;
      color: #1E7E34;
      border: 1px solid #A8D5B5;
    }

    .result-error {
      background: #FDECEA;
      color: #B00020;
      border: 1px solid #F5C6CB;
    }

    .footer {
      padding: 10px 16px;
      font-size: 11px;
      color: #999;
      text-align: center;
      border-top: 1px solid #E0E6F0;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title">AIESEC Marcall Tracker</div>
    <div class="header-sub">SalesQL Auto-Insert</div>
  </div>

  <div class="body">
    <div id="result-msg" class="result-msg"></div>

    <div class="card">
      <div class="card-label">Pending Contact</div>
      <div id="contact-display">
        <div class="empty-state">
          <div>No contact detected yet.</div>
          <div style="margin-top: 4px;">Reveal a contact in SalesQL on LinkedIn.</div>
        </div>
      </div>
    </div>

    <div id="action-buttons" style="display:none;">
      <button class="btn btn-primary"    id="insert-btn">➕ Add to Main Database</button>
      <button class="btn btn-secondary"  id="dismiss-btn">Dismiss</button>
    </div>
  </div>

  <div class="footer" id="footer-pic">Loading your account...</div>

  <script src="popup.js"></script>
</body>
</html>
